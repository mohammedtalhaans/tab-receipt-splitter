name: Verify and deploy tab
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      RUN_OCR_TESTS: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci
      - name: Set project-page paths and source link
        env:
          CUSTOM_BASE: ${{ vars.VITE_BASE }}
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_BASE" ]; then base="$CUSTOM_BASE";
          elif [[ "${repo,,}" == *.github.io ]]; then base="/";
          else base="/$repo/"; fi
          echo "VITE_BASE=$base" >> "$GITHUB_ENV"
          echo "VITE_REPOSITORY_URL=https://github.com/$GITHUB_REPOSITORY" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_BASE_URL=http://127.0.0.1:4173$base" >> "$GITHUB_ENV"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests and exact-cent invariants
        run: npm test
      - name: Privacy source audit
        run: npm run check:privacy
      - name: Build static production files
        run: npm run build
      - name: Check asset paths, OCR assets, and initial bundle
        run: npm run check:dist
      - name: Install test browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Test the production build, including actual local OCR
        run: npm run test:e2e
      - name: Upload verified site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Deploy verified static artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
